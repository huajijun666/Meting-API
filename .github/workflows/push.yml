name: 构建并推送镜像
on: push

jobs:
  npm-build:
    name: npm工作
    runs-on: ubuntu-latest

    steps:
    - name: 读取
      uses: actions/checkout@v4

    - name: 登录
      uses: docker/login-action@v3
      with: 
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.TOKEN }}
    - name: 构建并推送
      uses: docker/build-push-action@v6
      with: 
        push: true
        tags: huajijunqwq/meting-api:latest
